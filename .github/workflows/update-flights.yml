name: Update flight data

on:
  schedule:
    - cron: '*/10 * * * *'   # trigger every 10 min
  workflow_dispatch:          # manual trigger in Actions

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - run: python scripts/fetch_flights.py

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/flights.geojson
          git diff --staged --quiet || git commit -m "Update flight data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push